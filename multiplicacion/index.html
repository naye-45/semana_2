<!DOCTYPE html>
<html lang="es"> 
<head>
    <meta charset="UTF-8">
    <title>Tabla de Multiplicar</title>
    <link rel="stylesheet" href="../clasificador/style.css">
</head>
<body>
    <div class="card">
        <h2>Ejercicio 2 — Tabla de multiplicar</h2>
        <form id="tablaForm">
            <div class="input-group">
                <label for="inputNumero">Número a multiplicar:</label>
                <input type="number" id="inputNumero" required placeholder="Ej: 7">
            </div>

            <div class="input-group">
                <label for="inputHasta">Multiplicar hasta (máx. 20):</label>
                <input type="number" id="inputHasta" min="1" max="20" required placeholder="Ej: 10">
            </div>

            <button type="submit">Generar Tabla</button>
        </form>

        <!-- Aquí se insertará la tabla devuelta por la función -->
        <div id="contenedorTabla" class="resultado-container"></div>
    </div>

    <!-- Conectamos la lógica JS -->
    <script src="app.js"></script>
    <script>
        const form = document.getElementById('tablaForm');
        form.addEventListener('submit', function(event) {
            event.preventDefault(); // Evitamos recargar la página

            const num = parseInt(document.getElementById('inputNumero').value);
            const limite = parseInt(document.getElementById('inputHasta').value);

            // Obtenemos el HTML generado por la función
            const htmlGenerado = generarTabla(num, limite);

            // Insertamos el HTML dentro del contenedor
            document.getElementById('contenedorTabla').innerHTML = htmlGenerado;
        });
    </script>
</body>
</html>
